name: "CI Web E2E"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ci-web-e2e.yaml"
      - ".github/workflows/ci-e2e-reusable.yaml"
      - ".node-version"
      - "frontend/**"

permissions:
  contents: "read"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    uses: ./.github/workflows/ci-e2e-reusable.yaml
    with:
      skaffold-profile: task-canvas-web-e2e
      specs-dir: specs/task-canvas-web/
      pod-log-selectors: "app=task-canvas-web,app=task-canvas-api-mock"
      extra-checkout-repo: task-canvas-progress
