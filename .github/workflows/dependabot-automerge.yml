name: Dependabot Auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 30
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor updates are auto-approved and auto-merged after CI passes.
      # Branch protection requires 1 approving review; dependabot[bot] can't
      # approve its own PR, so nothing was ever satisfying that requirement
      # and auto-merge sat blocked indefinitely. github-actions[bot] is a
      # distinct actor from dependabot[bot], so it can supply the approval.
      - name: Auto-approve patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch protection has no required status checks configured, so a
      # plain `gh pr merge --auto` has nothing to wait for besides the review
      # above and merges within seconds — before next-build/storybook-build/
      # web-e2e etc. even finish. Wait for every other check on the PR's head
      # commit (excluding this workflow's own run, to avoid self-deadlock)
      # before merging for real.
      - name: Wait for other checks to complete
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        uses: lewagon/wait-on-check-action@07b3e1aff439a8dcbe1df42d433fe8f3e5c1db8c # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: 'Dependabot Auto-merge'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

      - name: Auto-merge patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
