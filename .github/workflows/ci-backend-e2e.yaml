name: "CI Backend E2E"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ci-backend-e2e.yaml"
      - ".github/workflows/ci-e2e-reusable.yaml"
      - ".sdkmanrc"
      - "backend/**"

permissions:
  contents: "read"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-e2e:
    uses: ./.github/workflows/ci-e2e-reusable.yaml
    with:
      skaffold-profile: task-canvas-api-e2e
      specs-dir: specs/task-canvas/
      pod-log-selectors: "app=task-canvas-api,app=task-canvas-db"
      pod-exclude-pattern: db-connection-test
